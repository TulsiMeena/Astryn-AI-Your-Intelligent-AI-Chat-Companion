name: Build Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME=${JAVA_HOME}"
          if [ -z "${JAVA_HOME}" ]; then
            echo "Error: JAVA_HOME is not set." >&2
            exit 1
          fi
          JAVA_VER=$(java -version 2>&1 | head -n 1 | sed -E 's/.*"([0-9]+)(\.[0-9]+.*)?".*/\1/')
          echo "Detected Java major version: ${JAVA_VER}"
          if [ -z "${JAVA_VER}" ] || [ "${JAVA_VER}" -lt 17 ]; then
            echo "Error: Active Java major version (${JAVA_VER}) is lower than 17." >&2
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "./debug.keystore already exists. Skipping generation."
          else
            echo "Generating temporary ./debug.keystore using Java 17 keytool..."
            "${JAVA_HOME}/bin/keytool" -genkeypair -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "Error: ./debug.keystore could not be created or does not exist." >&2
            exit 1
          fi
          echo "Confirmed ./debug.keystore is present."

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify Debug APK output
        run: |
          TARGET_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "${TARGET_APK}" ]; then
            echo "Verified debug APK exists at: ${TARGET_APK}"
          else
            echo "Expected APK not found at ${TARGET_APK}. Searching inside app/build/outputs/apk..." >&2
            if [ -d "app/build/outputs/apk" ]; then
              FOUND_APKS=$(find app/build/outputs/apk -type f -name "*.apk" || true)
              if [ -n "${FOUND_APKS}" ]; then
                echo "Discovered APK paths:" >&2
                echo "${FOUND_APKS}" >&2
              else
                echo "No APK files found inside app/build/outputs/apk." >&2
              fi
            else
              echo "Directory app/build/outputs/apk does not exist." >&2
            fi
            echo "Error: Required debug APK (${TARGET_APK}) is missing." >&2
            exit 1
          fi

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
